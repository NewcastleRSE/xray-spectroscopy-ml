$schema: https://json-schema.org/draft/2020-12/schema
$id: direct.schema.yaml
title: 'XANESNET descriptor schema: direct'
$defs:
  descriptorDirect:
    type: object
    additionalProperties: false
    required:
    - descriptor_type
    - source_dir
    properties:
      descriptor_type:
        const: direct
        description: Identifier string for this descriptor type.
      source_dir:
        type: string
        description: Path to the directory holding ``.txt`` descriptor
          files (absolute or relative to cwd).  Files are named
          ``{file_stem}.txt`` with whitespace-delimited floats,
          one row per site.
      preload:
        type: boolean
        default: false
        description: If ``true``, load all ``.txt`` files into memory at
          init time.
    description: Reads pre-computed descriptor vectors from ``.txt``
      files on disk.
description: Descriptor schemas backed by ``DescriptorRegistry`` classes imported by ``xanesnet.descriptors``.
