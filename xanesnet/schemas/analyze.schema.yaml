$schema: https://json-schema.org/draft/2020-12/schema
$id: analyze.schema.yaml
title: XANESNET analysis configuration
type: object
additionalProperties: false
$comment: Analysis configs are validated by validate_config_schema(). All component lists default to empty. Selectors are
  configured as one flat YAML list; runtime setup expands that list once per prediction reader. If the five built-in
  pipeline lists are empty, only the custom-module stage runs. Otherwise an empty selector list creates an implicit
  all-selector.
properties:
  seed:
    $ref: shared/value_types.schema.yaml#/$defs/nullableInteger
    default: null
    description: Optional top-level seed; absent values default to ``null`` before runtime use.
  selectors:
    type: array
    items:
      $ref: analysis/analysis.schema.yaml#/$defs/selector
    default: []
    description: Flat analysis selector configuration list. ``_setup_selectors`` instantiates this list for each prediction
      reader, producing ``selectors[predictions_idx][selector_idx]`` at runtime; an empty list creates an implicit ``all``
      selector when the built-in analysis pipeline runs.
  collectors:
    type: array
    items:
      $ref: analysis/analysis.schema.yaml#/$defs/collector
    default: []
    description: Analysis collector configurations instantiated by ``CollectorRegistry`` in ``_setup_collectors``.
  aggregators:
    type: array
    items:
      $ref: analysis/analysis.schema.yaml#/$defs/aggregator
    default: []
    description: Analysis aggregator configurations instantiated by ``AggregatorRegistry`` in ``_setup_aggregators``.
  reporters:
    type: array
    items:
      $ref: analysis/analysis.schema.yaml#/$defs/reporter
    default: []
    description: Analysis reporter configurations instantiated by ``ReporterRegistry`` in ``_setup_reporters``.
  plotters:
    type: array
    items:
      $ref: analysis/analysis.schema.yaml#/$defs/plotter
    default: []
    description: Analysis plotter configurations instantiated by ``PlotterRegistry`` in ``_setup_plotters``.
  custom_modules:
    type: array
    items:
      $ref: analysis/analysis.schema.yaml#/$defs/custom_module
    default: []
    description: Custom analysis modules instantiated by ``CustomModuleRegistry`` in ``core_analyze``.
  preload:
    type: boolean
    default: false
    description: Preloads prediction records and matched raw structures into memory during setup instead of
      reading them from disk on every sample access.
description: Analysis configuration validated by ``validate_config_schema`` and consumed by ``core_analyze``.
