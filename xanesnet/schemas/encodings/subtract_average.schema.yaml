$schema: https://json-schema.org/draft/2020-12/schema
$id: subtract_average.schema.yaml
title: 'XANESNET encoding schema: subtract_average'
$defs:
  encodingSubtractAverage:
    type: object
    additionalProperties: false
    required:
    - encoding_type
    - average
    properties:
      encoding_type:
        const: subtract_average
        description: Identifier string for this encoding type.
      average:
        $ref: ../shared/value_types.schema.yaml#/$defs/autoNumberArrayOrMatrix
        description: Per-point average spectrum. A single flat list when ``per_element`` is false, or
          one row per element aligned with ``elements`` when true. May be the training-time ``auto``
          token, which is resolved from the training data.
      per_element:
        type: boolean
        default: false
        description: Whether the average is selected per absorbing element (true) or shared across all
          elements (false). When true, ``average`` holds one row per entry of ``elements``.
      elements:
        $ref: ../shared/value_types.schema.yaml#/$defs/positiveIntegerArrayOrAuto
        description: Absorber atomic numbers aligned row-wise with ``average`` when ``per_element`` is
          true; may be the training-time ``auto`` token, which resolves to all elements observed in
          the training data. Omit when ``per_element`` is false.
    description: Average-spectrum subtraction encoding that trains on residuals about the mean spectrum,
      optionally keyed by absorbing element.
description: Encoding schemas backed by ``SpectraEncodingRegistry`` classes and encoding constructor signatures.
