$schema: https://json-schema.org/draft/2020-12/schema
$id: concat.schema.yaml
title: 'XANESNET encoding schema: concat'
$defs:
  encodingConcat:
    type: object
    additionalProperties: false
    required:
    - encoding_type
    - encodings
    properties:
      encoding_type:
        enum:
        - concat
        default: concat
        description: Identifier string for this encoding type.
      encodings:
        type: array
        minItems: 1
        items:
          oneOf:
          - $ref: none.schema.yaml#/$defs/encodingNone
          - $ref: scale.schema.yaml#/$defs/encodingScale
          - $ref: fourier.schema.yaml#/$defs/encodingFourier
          - $ref: gaussian.schema.yaml#/$defs/encodingGaussian
          - $ref: z_score.schema.yaml#/$defs/encodingZScore
          - $ref: min_max.schema.yaml#/$defs/encodingMinMax
          - $ref: subtract_average.schema.yaml#/$defs/encodingSubtractAverage
        default:
        - encoding_type: identity
        description: Non-empty, ordered list of sub-encoding configurations to concatenate
          in parallel. Each entry must provide ``encoding_type``.  Concat encodings
          cannot be nested inside another concat encoding.
    description: Concatenation encoding that applies multiple independent encodings in parallel
      and concatenates their outputs along the last dimension. During decoding, predictions are
      split, decoded independently, and averaged.
description: Encoding schemas backed by ``SpectraEncodingRegistry`` classes and encoding constructor signatures.
