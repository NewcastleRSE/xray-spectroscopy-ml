$schema: https://json-schema.org/draft/2020-12/schema
$id: scale.schema.yaml
title: 'XANESNET encoding schema: scale'
$defs:
  encodingScale:
    type: object
    additionalProperties: false
    required:
    - encoding_type
    - factor
    properties:
      encoding_type:
        const: scale
        description: Identifier string for this encoding type.
      factor:
        $ref: ../shared/value_types.schema.yaml#/$defs/autoNumberArrayOrMatrix
        description: Divisors applied during encoding (``x / factor``). Near-zero values are silently
          clamped to 1.0. A flat list (per-point
          when ``per_point`` is true, otherwise a single global factor) when ``per_element`` is false,
          or one row per element aligned with ``elements`` when true. May be the training-time
          ``auto`` token, which resolves to the standard deviation of the training data.
      per_point:
        type: boolean
        default: true
        description: Whether scaling is applied per spectrum point (true) or globally with a single
          factor (false).
      per_element:
        type: boolean
        default: false
        description: Whether the factor is selected per absorbing element (true) or shared across all
          elements (false). When true, ``factor`` holds one row per entry of ``elements``.
      elements:
        $ref: ../shared/value_types.schema.yaml#/$defs/nullablePositiveIntegerArrayOrAuto
        description: Absorber atomic numbers aligned row-wise with ``factor`` when ``per_element`` is
          true; may be the training-time ``auto`` token, which resolves to all elements observed in
          the training data. ``null`` when ``per_element`` is false.
    description: Per-point or global factor-scaling encoding that divides by the factor, optionally
      keyed by absorbing element.
description: Encoding schemas backed by ``SpectraEncodingRegistry`` classes and encoding constructor signatures.
