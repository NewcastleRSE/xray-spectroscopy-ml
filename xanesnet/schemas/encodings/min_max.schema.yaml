$schema: https://json-schema.org/draft/2020-12/schema
$id: min_max.schema.yaml
title: 'XANESNET encoding schema: min_max'
$defs:
  encodingMinMax:
    type: object
    additionalProperties: false
    required:
    - encoding_type
    - minimum
    - maximum
    properties:
      encoding_type:
        const: min_max
        description: Identifier string for this encoding type.
      minimum:
        $ref: ../shared/value_types.schema.yaml#/$defs/autoNumberArrayOrMatrix
        description: Minima used during normalization. A flat list (per-point when ``per_point`` is
          true, otherwise a single global minimum) when ``per_element`` is false, or one row per
          element aligned with ``elements`` when true. May be the training-time ``auto`` token, which
          is resolved from the training data.
      maximum:
        $ref: ../shared/value_types.schema.yaml#/$defs/autoNumberArrayOrMatrix
        description: Maxima used during normalization, shaped like ``minimum``. May be the
          training-time ``auto`` token, which is resolved from the training data.
      per_point:
        type: boolean
        default: true
        description: Whether normalization is applied per spectrum point (true) or globally with a
          single minimum and maximum (false).
      per_element:
        type: boolean
        default: false
        description: Whether bounds are selected per target-site element (true) or shared across all
          elements (false). When true, ``minimum`` and ``maximum`` hold one row per entry of
          ``elements``.
      elements:
        $ref: ../shared/value_types.schema.yaml#/$defs/nullablePositiveIntegerArrayOrAuto
        description: Target-site atomic numbers aligned row-wise with ``minimum`` and ``maximum`` when
          ``per_element`` is true; may be the training-time ``auto`` token, which resolves to all
          elements observed in the training data. ``null`` when ``per_element`` is false.
    description: Per-point or global min-max normalization encoding into the unit interval, optionally
      keyed by target-site element.
description: Encoding schemas backed by ``SpectraEncodingRegistry`` classes and encoding constructor signatures.
