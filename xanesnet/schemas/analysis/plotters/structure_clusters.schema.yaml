$schema: https://json-schema.org/draft/2020-12/schema
$id: structure_clusters.schema.yaml
title: 'XANESNET plotter schema: structure_clusters'
$defs:
  plotterStructureClusters:
    type: object
    additionalProperties: false
    required:
    - plotter_type
    - err_key
    properties:
      plotter_type:
        const: structure_clusters
        description: Registered plotter name from the analysis configuration.
      err_key:
        type: string
        minLength: 1
        description: Scalar collector key used to rank and colour selectors. Must
          be produced by a configured collector.
    description: For every prediction reader with two or more selectors, plot a
      scoreboard comparing the selectors' mean error and a grid with one
      representative structure per selector. Useful for selectors that
      partition samples into groups, such as ``structure_cluster``, but works
      for any selector set.
description: Analysis component schemas used by ``core_analyze`` setup functions
  and analysis registries.
