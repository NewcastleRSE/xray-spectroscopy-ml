$schema: https://json-schema.org/draft/2020-12/schema
$id: tensorboard.schema.yaml
title: 'XANESNET custom module schema: tensorboard'
$defs:
  customModuleTensorboard:
    type: object
    additionalProperties: false
    required:
      - custom_module_type
      - tensorboard_dirs
    properties:
      custom_module_type:
        const: tensorboard
        description: Registered custom module name.
      tensorboard_dirs:
        type: array
        minItems: 1
        items:
          type: string
        description: TensorBoard directories aligned with the inference-run order.
      plot_size:
        $ref: ../plotters/plotters.schema.yaml#/$defs/plotSize
      latex_font:
        $ref: ../plotters/plotters.schema.yaml#/$defs/latexFont
      y_scale:
        type: string
        enum:
          - linear
          - log
        default: linear
        description: Scale used for both vertical axes.
      double_width:
        type: boolean
        default: false
        description: Double the base figure width while keeping its height.
    description: Plot training loss, validation loss, and learning rate from TensorBoard event files.