# Example configuration for GemNet-OC training with toy data.

seed: 2025
device: cuda

datasource:
  datasource_type: pmgjson
  json_path: ./data/toy_data/

dataset:
  # general:
  dataset_type: gemnet_oc
  root: ./data/processed/toy_data_gemnet_oc/  # Where should the processed data be stored
  preload: True                   # Preload dataset into RAM if True; otherwise load on-the-fly
  skip_prepare: False
  split_ratios: [0.8, 0.2]
  # params:
  graph_builder:
    graph_builder_type: cov_radius
    cutoff: 5.0
    cov_radii_scale: 2.5
    max_num_neighbors: 50
  # Quadruplets:
  quadruplets: True
  int_graph_builder:
    graph_builder_type: cov_radius
    cutoff: 5.0
    cov_radii_scale: 3.5
    max_num_neighbors: 50
  # OC-specific params:
  oc_mode: True
  oc_aeaint_graph_builder:
    graph_builder_type: cov_radius
    cutoff: 5.0
    cov_radii_scale: 2.5
    max_num_neighbors: 50
  oc_aint_graph_builder:
  graph_builder:
    graph_builder_type: cov_radius
    cutoff: 5.0
    cov_radii_scale: 3.5
    max_num_neighbors: 50
  
encodings:
  - encoding_type: identity

model:
  # general:
  model_type: gemnet_oc
  # params:
  num_targets: auto
  num_spherical: 7
  num_radial: 6
  num_blocks: 4
  emb_size_atom: 128
  emb_size_edge: 128
  emb_size_trip_in: 64
  emb_size_trip_out: 64
  emb_size_quad_in: 32
  emb_size_quad_out: 32
  emb_size_aint_in: 64
  emb_size_aint_out: 64
  emb_size_rbf: 16
  emb_size_cbf: 16
  emb_size_sbf: 32
  num_before_skip: 2
  num_after_skip: 2
  num_concat: 1
  num_atom: 3
  num_output_afteratom: 3
  num_atom_emb_layers: 2
  num_global_out_layers: 2
  cutoff: 5.0 # 12.0 # the main graph radius. Controls e2e triplets and is the base for all other cutoffs. Must be ≤ all others.
  cutoff_qint: 10.0 # 12.0 # radius of the qint graph (interaction graph for quadruplets).
  cutoff_aeaint: 5.0 # 12.0 # radius of the a2ee2a graph used by atom↔edge interactions.
  cutoff_aint: 10.0 # 12.0 # radius of the a2a graph for atom-atom interactions.
  rbf:
    name: gaussian
  rbf_spherical:
    name: gaussian
  envelope:
    name: polynomial
    exponent: 5
  cbf:
    name: spherical_harmonics
  sbf:
    name: spherical_harmonics
  output_init: HeOrthogonal
  activation: silu
  quad_interaction: True # quadruplet interaction: path of 4 atoms via two graphs (main + qint)
  atom_edge_interaction: True # An atom's embedding directly modulates an incoming edge message (via the a2ee2a graph)
  edge_atom_interaction: True # Edge messages update atom embeddings directly (reverse of a2e, same a2ee2a graph)
  atom_interaction: True # Pure atom-to-atom message passing without angular information (cheaper, long-range, a2a graph).
  scale_basis: False
  num_elements: 100

trainer:
  # general:
  trainer_type: basic
  batch_size: 4
  shuffle: True
  drop_last: False
  num_workers: 0
  # params:
  epochs: 50
  learning_rate: 0.001
  optimizer: Adam
  max_norm: null
  validation_interval: 10
  lr_warmup: True
  warmup_steps: 500
  loss:
    - loss_type: mse
  regularizer:
    regularizer_type: none
    weight: 1.0
  lr_scheduler:
    lr_scheduler_type: linear
    start_factor: 1.0 
    end_factor: 0.1
    total_iters: 40
  early_stopper:
    early_stopper_type: basic 
    patience: 25
    min_delta: 0.001
    restore_best: True

strategy:
  # general:
  strategy_type: single
  weight_init: xavier_uniform
  weight_init_params: {}
  bias_init: zeros
  checkpoint_interval: 25
  # params:

