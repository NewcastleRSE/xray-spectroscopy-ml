# Example configuration for E3EE training with toy data.

seed: 2025
device: cuda

datasource:
  datasource_type: pmgjson
  json_path: ./data/toy_data/

dataset:
  # general:
  dataset_type: e3ee
  root: ./data/processed/toy_data_e3ee/  # Where should the processed data be stored
  preload: True                           # Preload dataset into RAM if True; otherwise load on-the-fly
  skip_prepare: False
  split_ratios: [0.8, 0.2]
  # params:
  graph_builder:
    graph_builder_type: cov_radius
    cutoff: 5.0
    cov_radii_scale: 2.5
    max_num_neighbors: 50
  # attention graph (used by attention branches):
  att_graph_builder:
    graph_builder_type: radius
    cutoff: 10.0
    max_num_neighbors: 128
  use_path_branch: False
  max_paths_per_structure: 128
encodings:
  - encoding_type: identity

model:
  # general:
  model_type: e3ee
  # params:
  out_size: auto
  max_z: 100
  atom_emb_dim: 64
  atom_hidden_dim: 128
  atom_layers: 3
  local_cutoff: 6.0
  rbf_dim: 32
  energy_rbf_dim: 48
  scatter_dim: 128
  latent_dim: 128
  head_hidden_dim: 128
  e3nn_irreps: "64x0e + 32x1o + 16x2e"
  e3nn_irreps_message: "16x0e + 8x1o + 4x2e"
  e3nn_lmax: 2
  out_mlp_layers: 3
  use_invariant_branch: True
  use_attention_branch: True
  use_equivariant_branch: True
  use_eq_attention_branch: True
  use_conv_branch: False
  use_eq_conv_branch: False
  use_path_branch: False
  fusion_mode: cat
  residual_scale_init: 0.1
  attention_heads: 4
  attention_rbf_dim: 16
  attention_lmax: 2
  attention_irreps: "32x0e + 16x1o + 8x2e"
  att_cutoff: 10.0
  conv_use_gate: True

trainer:
  # general:
  trainer_type: basic
  batch_size: 4
  shuffle: True
  drop_last: False
  num_workers: 0
  # params:
  epochs: 50
  learning_rate: 0.001
  optimizer: Adam
  max_norm: null
  validation_interval: 10
  lr_warmup: True
  warmup_steps: 500
  loss:
    - loss_type: mse
  regularizer:
    regularizer_type: none
  lr_scheduler:
    lr_scheduler_type: linear
    start_factor: 1.0
    end_factor: 0.1
    total_iters: 40
  early_stopper:
    early_stopper_type: basic
    patience: 25
    min_delta: 0.001
    restore_best: True

strategy:
  # general:
  strategy_type: single
  weight_init: xavier_uniform
  bias_init: zeros
  checkpoint_interval: 25
  # params: