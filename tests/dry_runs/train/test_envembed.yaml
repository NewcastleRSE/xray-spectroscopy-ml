seed: 2025
device: cpu

datasource:
  datasource_type: pmgjson
  json_path: ./data/toy_data/
  spectrum_key: "XANES"

dataset:
  dataset_type: envembed
  root: ./data/processed/toy_data_envembed_test/
  preload: True
  skip_prepare: False
  split_ratios: [0.8, 0.2]
  widths_eV: [0.2, 1.0, 2.0]
  basis_stride: 4
  env_radius: 6.0
  descriptors:
    - descriptor_type: wacsf
      r_min: 1.0
      r_max: 6.0
      n_g2: 8
      n_g4: 16

encodings:
  - encoding_type: scale
    factor: auto

model:
  model_type: envembed
  in_size: auto
  kgroups: auto

trainer:
  trainer_type: basic
  batch_size: 4
  shuffle: True
  drop_last: False
  num_workers: 0
  epochs: 2
  learning_rate: 0.001
  optimizer: Adam
  max_norm: null
  validation_interval: 10
  lr_warmup: False
  loss:
    - loss_type: specplus
  regularizer:
    regularizer_type: none
  lr_scheduler:
    lr_scheduler_type: none
  early_stopper:
    early_stopper_type: basic
    patience: 1
    min_delta: 0.0
    restore_best: False

strategy:
  strategy_type: single
  weight_init: xavier_uniform
  bias_init: zeros
  checkpoint_interval: 1
