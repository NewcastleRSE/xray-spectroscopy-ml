seed: 2025
device: cpu

datasource:
  datasource_type: pmgjson
  json_path: ./data/toy_data/

dataset:
  dataset_type: geometrygraph
  root: ./data/processed/toy_data_dimenet_pp_test/
  preload: True
  skip_prepare: False
  split_ratios: [0.8, 0.2]
  graph_builder:
    graph_builder_type: radius
    cutoff: 5.0
    max_num_neighbors: 32
  compute_angles: True

encodings:
  - encoding_type: identity

model:
  model_type: dimenet++
  hidden_channels: 32
  out_channels: auto
  num_blocks: 2
  int_emb_size: 32
  basis_emb_size: 4
  out_emb_channels: 64
  num_spherical: 3
  num_radial: 3
  cutoff: 5.0
  envelope_exponent: 5
  num_before_skip: 1
  num_after_skip: 1
  num_output_layers: 2
  act: swish
  output_initializer: glorot_orthogonal

trainer:
  trainer_type: basic
  batch_size: 4
  shuffle: True
  drop_last: False
  num_workers: 0
  epochs: 2
  learning_rate: 0.001
  optimizer: Adam
  max_norm: null
  validation_interval: 10
  lr_warmup: False
  loss:
    - loss_type: mse
  regularizer:
    regularizer_type: none
  lr_scheduler:
    lr_scheduler_type: none
  early_stopper:
    early_stopper_type: basic
    patience: 1
    min_delta: 0.0
    restore_best: False

strategy:
  strategy_type: single
  weight_init: xavier_uniform
  bias_init: zeros
  checkpoint_interval: 1
